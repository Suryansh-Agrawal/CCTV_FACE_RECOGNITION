<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Known Face - AI CCTV System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2098/2098402.png">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <div class="nav-logo">
                <i class="fas fa-shield-alt"></i> AI CCTV System
            </div>
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="{{ url_for('index') }}" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="{{ url_for('profile') }}" class="nav-link">
                    <i class="fas fa-user-cog"></i> Profile
                </a>
                <a href="{{ url_for('add_face_page') }}" class="nav-link active">
                    <i class="fas fa-user-plus"></i> Add Face
                </a>
            </div>
        </nav>

        <header>
            <h1><i class="fas fa-user-plus"></i> Add Known Face</h1>
            <p class="subtitle">Register trusted individuals for recognition</p>
        </header>
        
        <div class="add-face-container">
            <div class="add-face-card">
                <div class="video-container">
                    <img src="{{ url_for('video_feed') }}" alt="Video Feed">
                    <div class="video-overlay">
                        <div class="video-status">Live</div>
                    </div>
                </div>
                
                <div class="capture-controls">
                    <div class="form-group">
                        <label for="face-name"><i class="fas fa-user-tag"></i> Person's Name</label>
                        <input type="text" id="face-name" placeholder="Enter name of the person" required>
                    </div>
                    
                    <div class="buttons-group">
                        <button id="capture-btn" class="action-btn">
                            <i class="fas fa-camera"></i> Capture Image
                        </button>
                        <button id="add-face-btn" class="action-btn" disabled>
                            <i class="fas fa-plus-circle"></i> Add to Known Faces
                        </button>
                    </div>
                </div>
                
                <div class="captured-image-section">
                    <h3><i class="fas fa-image"></i> Captured Image</h3>
                    <div class="captured-image-container" id="captured-image-container" style="display: none;">
                        <canvas id="capture-canvas" width="320" height="240"></canvas>
                    </div>
                    <div id="add-face-status" class="status-message"></div>
                </div>
            </div>
            
            <div class="known-faces-card">
                <h2><i class="fas fa-user-shield"></i> Known Faces</h2>
                <div class="known-faces-list-container">
                    <div id="known-faces-list" class="faces-list">
                        <p class="loading-text">Loading known faces...</p>
                    </div>
                </div>
                
                <div class="faces-stats">
                    <div class="stat">
                        <span class="stat-number" id="faces-count">{{ known_faces_count }}</span>
                        <span class="stat-label">Registered</span>
                    </div>
                    <button class="action-btn danger">
                        <i class="fas fa-trash-alt"></i> Clear All
                    </button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>&copy; 2023 AI CCTV Face Recognition System | Developed by Garud Team</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
